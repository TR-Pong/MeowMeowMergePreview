<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeowMeowMerge — Web Demo</title>
<style>
:root { --page: #39251f; --paper: #fff2d0; --accent: #edb77f; }
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--page); }
body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
header, footer { flex: none; color: var(--paper); text-align: center; font-size: 12px; line-height: 1.4; padding: 7px 12px; }
header { font-weight: 700; letter-spacing: .06em; }
footer { font-size: 11px; opacity: .85; }
#viewport { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; }
#unity-container { position: relative; overflow: hidden; background: var(--page); }
#unity-canvas { display: block; width: 100%; height: 100%; outline: none; background: var(--page); }
#loading { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; padding: 24px; color: var(--paper); text-align: center; pointer-events: none; }
#loading[hidden] { display: none; }
progress { width: min(240px, 80%); height: 12px; accent-color: var(--accent); }
#status { max-width: 100%; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>MEOW MEOW MERGE · WEB DEMO</header>
<main id="viewport">
<div id="unity-container">
<canvas id="unity-canvas" width="720" height="1280" tabindex="0" aria-label="MeowMeowMerge"></canvas>
<div id="loading" role="status"><span id="status">Loading MeowMeowMerge…</span><progress id="progress" max="1" value="0"></progress></div>
</div>
</main>
<footer>Drag to aim · Release to drop · Unlimited play · Browser save</footer>
<script>
const container = document.getElementById('unity-container');
const canvas = document.getElementById('unity-canvas');
const loading = document.getElementById('loading');
const status = document.getElementById('status');
const progress = document.getElementById('progress');
const gameViewport = document.getElementById('viewport');
function fitPortrait() {
  const viewport = window.visualViewport;
  const availableWidth = Math.min(gameViewport.clientWidth, viewport ? viewport.width : window.innerWidth);
  const availableHeight = Math.min(gameViewport.clientHeight, (viewport ? viewport.height : window.innerHeight) - document.querySelector('header').offsetHeight - document.querySelector('footer').offsetHeight);
  const width = Math.min(availableWidth, availableHeight * 9 / 16);
  container.style.width = width + 'px';
  container.style.height = width * 16 / 9 + 'px';
}
fitPortrait();
window.addEventListener('resize', fitPortrait);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitPortrait);
canvas.addEventListener('pointerdown', () => canvas.focus({ preventScroll: true }));
const buildUrl = 'Build';
const config = {
  dataUrl: buildUrl + '/56dca867263bb962a27461fecb804fc3.data.unityweb',
  frameworkUrl: buildUrl + '/3da181100fbb316b03da77109970da05.framework.js.unityweb',
  codeUrl: buildUrl + '/bea91318c94b1efa6a4c5aaad42fb5fa.wasm.unityweb',
  streamingAssetsUrl: 'StreamingAssets',
  companyName: "DefaultCompany",
  productName: "MeowMeowMerge",
  productVersion: "1.0",
  matchWebGLToCanvasSize: true,
  devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
  autoSyncPersistentDataPath: true,
  showBanner: (message, type) => {
    if (type === 'error') { loading.hidden = false; status.textContent = message; progress.hidden = true; }
    else console.warn(message);
  }
};
const script = document.createElement('script');
script.src = buildUrl + '/d1e7a18d130293517da78a74e4a92291.loader.js';
script.onload = () => {
  createUnityInstance(canvas, config, value => { progress.value = value; })
    .then(() => { loading.hidden = true; fitPortrait(); })
    .catch(error => { status.textContent = String(error); progress.hidden = true; });
};
script.onerror = () => { status.textContent = 'Could not load the game. Please reload the page.'; progress.hidden = true; };
document.body.appendChild(script);
</script>
</body>
</html>
